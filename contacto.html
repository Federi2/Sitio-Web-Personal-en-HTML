<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
    <h1>Página de contacto</h1>
     <br><br>
     <form action="datos.php" method="post">
               <img src="img/amadou.webp" alt="Foto de Amadou" width="400">
        <!-- Bloque 1: Datos personales -->
        <fieldset>
        <legend>Datos personales</legend>

        <label for="nombre"> Nombre </label>
        <input type="text" id="nombre" name="nombre" value="Fede">
        <br>
        <label for="apellido">Apellido</label>
        <!-- placeholder sirve para poner un texto que se borra automaticamente al escribir-->
        <input type="text" id="apellido" name="apellido" placeholder="Escriba aquí su apellido">
        <br>
        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" value="18" min="0" max="120">
        <br>
        <label for="ciudad">Ciudad (Andalucía)</label>
        <select name="ciudad" id="ciudad">
            <option value="jaen">Jaén</option>
            <option value="sevilla">Sevilla</option>
            <option value="malaga">Málaga</option>
            <option value="granada">Sevilla</option>
            <option value="cordoba">Córdoba</option>
            <option value="cadiz">Cádiz</option>
            <option value="almeria">Almeria</option>
            <option value="huelva">Huelva</option>
            </select>
        </fieldset>
        <br>

        <!-- Bloque 2: Datos de la cuenta -->
         <fieldset>
            <legend>Datos de la cuenta</legend>

            <label for="correo">Correo electrónico</label>
            <input type="email" name="correo" id="correo" placeholder="ejemplo@correo.com">
            <br>
            <label for="password">Contraseña</label>
            <input type="password" name="contraseña" id="contraseña">
         </fieldset>
        <br>

        <!-- Bloque 3: Aficiones -->
         <fieldset>
            <Legend>Aficiones</Legend>
            Selecciona tus aficiones favoritas
            <br>

            <!-- Estoy usando aficiones[] para que se puedan enviar varias opciones seleccionadas a PHP -->
             <label for="aficion_videojuegos">Videojuegos</label>
             <input type="checkbox" id="aficion_videojuegos" name="aficiones[]" value="videojuegos" checked>
             <br>
             <label for="aficion_musica">Música</label>
             <input type="checkbox" id="aficion_musica" name="aficiones[]" value="musica">
             <br>
             <label for="aficion_deporte">Deporte</label>
             <input type="checkbox" id="aficion_deporte" name="aficiones[]" value="deporte">
             <br>
             <label for="aficion_cine">Cine</label>
             <input type="checkbox" id="cine" name="aficiones[]" value="cine">
             <br>
             <label for="aficion_lectura">Lectura</label>
             <input type="checkbox" id="aficion_lectura" name="aficiones[]" value="lectura">
             <br>
         </fieldset>
         <br>

        <!-- Bloque 4: Mensaje -->
         <fieldset>
            <legend>Mensaje</legend>

            <label for="mensaje">Escribe tu mensaje</label><br>
            <textarea name="mensaje" id="mensaje" rows="5" cols="40" placeholder="Escribe aquí tu mensaje"></textarea> 
         </fieldset>
         <br>

         <!-- Botones de borrar y enviar-->
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
<br><br>
    <a href="index.html"> Página principal</a><br><br>
    <a href="horario.html">Horario</a>
</body>
</html>
